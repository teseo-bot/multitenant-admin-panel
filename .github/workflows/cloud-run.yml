name: Deploy Mission Control → Production (micontexto-control)

# ADR-206 (GCP-Native): despliega el panel de control a Cloud Run en el proyecto
# `micontexto-control`. Reemplaza al workflow previo que apuntaba al proyecto muerto
# `teseocontextkdb` con secretos de Supabase. Auth del panel = Identity Platform.
#
# ⚠️ REQUISITOS DE INFRA (provisionar UNA vez con la cuenta con acceso, ver
# docs/gcp-migracion/CI-CD-SETUP.md). Hasta entonces el paso `auth` falla:
#   - Workload Identity pool+provider en micontexto-control ligado a este repo.
#   - SA `github-deployer@micontexto-control.iam.gserviceaccount.com` con roles
#     run.admin + artifactregistry.writer + iam.serviceAccountUser sobre panel-runtime.
#   - Variable de repo `NEXT_PUBLIC_FIREBASE_CONFIG` (config web de Identity Platform;
#     no es secreta — Google la publica en el cliente).

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: micontexto-control
  PROJECT_NUMBER: '1025015138700'
  REGION: us-central1
  SERVICE_NAME: multitenant-admin-panel
  GAR_LOCATION: us-central1-docker.pkg.dev
  REPOSITORY: panel-repo
  RUNTIME_SA: panel-runtime@micontexto-control.iam.gserviceaccount.com
  CLOUDSQL_INSTANCES: micontexto-control:us-central1:control-plane,micontexto-coldtier:us-central1:context-kdb-db

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    name: Build & Deploy → Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP via Workload Identity
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1025015138700/locations/global/workloadIdentityPools/github-actions/providers/github-provider'
          service_account: 'github-deployer@micontexto-control.iam.gserviceaccount.com'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for GCP Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }} --quiet

      - name: Build and Push Docker Image (with GHA cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Firebase (Identity Platform) es NEXT_PUBLIC_* → se hornea en el build del cliente.
          build-args: |
            NEXT_PUBLIC_FIREBASE_CONFIG=${{ vars.NEXT_PUBLIC_FIREBASE_CONFIG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
            ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:latest

      - name: Deploy to Cloud Run (Production)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: '--service-account=${{ env.RUNTIME_SA }} --add-cloudsql-instances=${{ env.CLOUDSQL_INSTANCES }}'
          env_vars: |
            NODE_ENV=production
            APP_URL=https://control.micontexto.com
            KDB_COMPILER_URL=https://context-kdb-compiler-137810875111.us-central1.run.app
            COMPILER_INTERNAL_URL=https://context-kdb-orchestrator-137810875111.us-central1.run.app
            MAILER_DRY_RUN=true
          secrets: |
            DATABASE_URL=CONTROL_DATABASE_URL:latest
            COLD_TIER_URL=COLD_TIER_URL_ORCH:latest
            M2M_API_KEY=M2M_API_KEY:latest
          env_vars_update_strategy: merge
          secrets_update_strategy: merge

      - name: Print Production URL
        run: echo "🚀 Producción desplegada en ${{ steps.deploy.outputs.url }}"
