name: Deploy Mission Control → Production (micontexto-control)

# ADR-206 (GCP-Native): despliega el panel de control a Cloud Run en el proyecto
# `micontexto-control`. Reemplaza al workflow previo que apuntaba al proyecto muerto
# `teseocontextkdb` con secretos de Supabase. Auth del panel = Identity Platform.
#
# ⚠️ REQUISITOS DE INFRA (provisionar UNA vez con la cuenta con acceso, ver
# docs/gcp-migracion/CI-CD-SETUP.md). Hasta entonces el paso `auth` falla:
#   - Workload Identity pool+provider en micontexto-control ligado a este repo.
#   - SA `github-deployer@micontexto-control.iam.gserviceaccount.com` con roles
#     run.admin + artifactregistry.writer + iam.serviceAccountUser sobre panel-runtime.
#   - Variable de repo `NEXT_PUBLIC_FIREBASE_CONFIG` (config web de Identity Platform;
#     no es secreta — Google la publica en el cliente).

on:
  push:
    branches:
      - main
  workflow_dispatch:

# ─── UN DESPLIEGUE A LA VEZ CONTRA ESTE SERVICIO ────────────────────────────────────
# Sin esto, dos merges seguidos a `main` disparan dos runs que compiten por el mismo
# servicio de Cloud Run, y la revisión que acaba sirviendo es la del run que TERMINA
# último — no la del commit más nuevo. Ocurrió en el orquestador el 2026-08-20, medido
# contra Cloud Run: merges a las 23:00:58 y 23:01:07 —NUEVE segundos— y tres revisiones en
# cinco minutos. Quedó sirviendo la correcta sólo porque la del código viejo estuvo lista
# 11 s antes que la intermedia; con el orden invertido, producción se habría quedado con el
# código anterior sin un solo run en rojo. Este repo tiene la misma forma de CD, y además es
# el PLANO DE CONTROL: lo que aquí sirva código viejo se nota en los tres paneles.
#
# `cancel-in-progress: false` = ENCOLAR, nunca cancelar. Cortar un deploy a media promoción
# puede dejar la revisión a medias; esperar sólo cuesta minutos. Y encolar NO deja atrás el
# commit nuevo: GitHub mantiene UN único run pendiente por grupo y el más reciente desplaza
# al que esperaba ⇒ el último commit sigue ganando, ahora por construcción y no por suerte.
#
# 🔴 El grupo va LITERAL, no `${{ env.SERVICE_NAME }}`. El contexto `env` NO está disponible
# en `concurrency` — ni a nivel de workflow (sólo `github`, `inputs`, `vars`) ni a nivel de
# job. Una referencia a `env` aquí no falla: se expande a cadena VACÍA, y todos los
# workflows del repo caen en el mismo grupo. Sería el bug contrario, y silencioso. El
# proyecto va en el nombre por la misma razón: hoy este repo despliega un solo servicio,
# pero `tenant-admin-panel` y `context-kdb-compiler` ya despliegan el MISMO nombre de
# servicio a dos proyectos distintos desde un solo repo.
concurrency:
  group: deploy-multitenant-admin-panel-micontexto-control
  cancel-in-progress: false

env:
  PROJECT_ID: micontexto-control
  PROJECT_NUMBER: '1025015138700'
  REGION: us-central1
  SERVICE_NAME: multitenant-admin-panel
  GAR_LOCATION: us-central1-docker.pkg.dev
  REPOSITORY: panel-repo
  RUNTIME_SA: panel-runtime@micontexto-control.iam.gserviceaccount.com
  CLOUDSQL_INSTANCES: micontexto-control:us-central1:control-plane,micontexto-coldtier:us-central1:context-kdb-db

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    name: Build & Deploy → Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP via Workload Identity
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1025015138700/locations/global/workloadIdentityPools/github-actions/providers/github-provider'
          service_account: 'github-deployer@micontexto-control.iam.gserviceaccount.com'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for GCP Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }} --quiet

      - name: Build and Push Docker Image (with GHA cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Firebase (Identity Platform) es NEXT_PUBLIC_* → se hornea en el build del cliente.
          build-args: |
            NEXT_PUBLIC_FIREBASE_CONFIG=${{ vars.NEXT_PUBLIC_FIREBASE_CONFIG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
            ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:latest

      - name: Deploy to Cloud Run (Production)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: '--service-account=${{ env.RUNTIME_SA }} --add-cloudsql-instances=${{ env.CLOUDSQL_INSTANCES }}'
          # ⚠️ NADA de comentarios DENTRO de los bloques `|` de env_vars/secrets: la acción los
          # parsea como CLAVE=VALOR e intenta montarlos. Tumbó el deploy 31033445622 (2026-08-05).
          #
          # MAIL_FROM: remitente de las invitaciones. El dominio debe estar VERIFICADO en Resend
          # (SPF/DKIM/DMARC); si no lo está, Resend devuelve 403 y `sendMail` LANZA — ruidoso a
          # propósito. `noreply@micontexto.com` es el remitente que ya se configuró para este
          # plano (ver docs/HANDOFF-2026-07-07.md y scripts/create-platform-admin.ts).
          env_vars: |
            NODE_ENV=production
            APP_URL=https://control.micontexto.com
            KDB_COMPILER_URL=https://context-kdb-compiler-137810875111.us-central1.run.app
            COMPILER_INTERNAL_URL=https://context-kdb-orchestrator-137810875111.us-central1.run.app
            MAIL_FROM=micontexto <noreply@micontexto.com>
          # RESEND_MAIL existe en micontexto-control desde el 2026-07-10, habilitado y hasta hoy
          # sin un solo lector. La SA de runtime necesita secretmanager.secretAccessor sobre él.
          secrets: |
            DATABASE_URL=CONTROL_DATABASE_URL:latest
            COLD_TIER_URL=COLD_TIER_URL_ORCH:latest
            M2M_API_KEY=M2M_API_KEY:latest
            RESEND_MAIL=RESEND_MAIL:latest
          # `merge` sólo AÑADE y PISA las claves listadas: borrar una línea de arriba NO la quita
          # del servicio vivo. Por eso `MAILER_DRY_RUN=true` —que se quitó de este bloque junto
          # con el mailer que lo leía— sigue puesto en producción hasta que se borre a mano:
          #
          #   gcloud run services update multitenant-admin-panel --project micontexto-control \
          #     --region us-central1 --remove-env-vars MAILER_DRY_RUN \
          #     --account jorge.garcia@innoteca.mx
          #
          # Hoy es inerte (ningún código lo lee), pero una variable que dice «no envío correo»
          # en un servicio que sí lo envía es exactamente la clase de mentira que costó la
          # primera invitación real. No cambiar a `overwrite` para arreglarlo: tiraría toda
          # variable puesta a mano en el servicio.
          env_vars_update_strategy: merge
          secrets_update_strategy: merge

      - name: Print Production URL
        run: echo "🚀 Producción desplegada en ${{ steps.deploy.outputs.url }}"
